# Harness Cloud — local run.
#
#   echo 'ANTHROPIC_API_KEY=sk-ant-...' > .env     # optional: enables agent replies
#   docker compose up -d --build
#   open http://localhost:8787
#
# First boot is empty: you create a project, then sessions and tasks in it. The event
# log, board and ledger live in Postgres (`db`, volume `harness-pg`); repository
# clones, session worktrees and the secrets master key live in `harness-data`.
#
#   HARNESS_DEMO=1 docker compose up -d     # the scripted, read-only demo scenario instead
#   docker compose down -v                  # wipe all data and start over

services:
  db:
    image: postgres:17-alpine
    container_name: harness-cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: harness
      POSTGRES_DB: harness
      # Not published to the host: only the app container can reach it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
    volumes:
      - harness-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: harness-cloud:local
    container_name: harness-cloud
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      HARNESS_DATA_DIR: /data
      DATABASE_URL: postgres://harness:${POSTGRES_PASSWORD:-harness}@db:5432/harness
      HARNESS_DEMO: ${HARNESS_DEMO:-0}
      # Any one of these turns agent replies on. Blank values are ignored.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      HARNESS_GATEWAY_URL: ${HARNESS_GATEWAY_URL:-}
      HARNESS_GATEWAY_KEY: ${HARNESS_GATEWAY_KEY:-}
      HARNESS_MODEL: ${HARNESS_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - harness-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/v1/workspace').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  harness-data:
  harness-pg:
