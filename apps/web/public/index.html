<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1012" />
    <meta name="color-scheme" content="dark" />
    <title>Harness Cloud</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="page-head">
      <a class="skip" href="#surface">Skip to content</a>
      <h1 class="sr-only">Harness Cloud — project acme-platform</h1>
    </header>

    <div id="app" class="shell">
      <!-- LEFT: workspace -> projects -> sessions. Sessions are durable objects. -->
      <nav class="rail" id="rail" aria-label="Workspace">
        <div class="rail-head">
          <span class="logo" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13V3M13 13V3M3 8h10"/></svg></span>
          <div>
            <div class="rail-title" id="rail-title" translate="no">Harness Cloud</div>
            <button class="ws-switch" id="ws-switch" aria-haspopup="listbox" aria-expanded="false">
              Navabrind IT <span aria-hidden="true">▾</span>
            </button>
          </div>
        </div>

        <h2 class="rail-section" id="projects-head">Projects</h2>
        <ul class="project-list" id="project-list" aria-labelledby="projects-head"></ul>

        <h2 class="rail-section" id="sessions-head">
          <span id="sessions-head-text">Sessions</span>
          <span class="capacity" id="capacity"></span>
        </h2>
        <ul class="session-list" id="session-list" aria-labelledby="sessions-head"></ul>

        <div class="rail-foot">
          <div class="who">
            <div class="avatar" aria-hidden="true">S</div>
            <div>
              <div class="who-name">shone</div>
              <div class="who-role">admin · Navabrind IT</div>
            </div>
          </div>
        </div>
      </nav>

      <!-- CENTER: one surface at a time, per project -->
      <main class="main">
        <div class="tabbar">
          <div class="tabs" id="tabs" role="tablist" aria-label="Project views"></div>
          <div class="mode-switch" id="mode-switch" role="group" aria-label="How much detail to show"></div>
        </div>
        <section class="surface" id="surface" tabindex="0" role="tabpanel" aria-live="polite"></section>
      </main>

      <!-- RIGHT: project status, not model telemetry -->
      <aside class="status" id="status" tabindex="0" aria-label="Project status"></aside>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
